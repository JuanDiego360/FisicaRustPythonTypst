# ==============================================================================
# CONFIGURACIÓN DE TAREAS MISE - SIMULADOR ELECTROSTÁTICO ULTRA EFICIENTE
# ==============================================================================
# Pipeline de ejecución:
#   datos.txt ──> [Rust: Binario precompilado] ──> output/calculo.json
#                         │
#                         ▼
#                 [Python: Matplotlib 2D/3D] ──> output/campo_electrico.png
#                         │
#                         ▼
#                 [Typst: Informe Científico] ──> output/reporte_campo_electrico.pdf
# ==============================================================================

[tasks.build]
description = "Compila o recompila el motor de Rust en modo --release (solo necesario si modificas el código en src/)"
sources = ["src/**/*.rs", "Cargo.toml"]
outputs = ["target/release/electrostatic_calc"]
run = "cargo build --release"

[tasks.rebuild]
description = "Fuerza la recompilación completa de Rust desde cero"
run = "cargo clean && cargo build --release"

[tasks.calc]
description = "Ejecuta los cálculos con el binario ya construido (si no existe, lo compila una sola vez)"
run = "([ -f target/release/electrostatic_calc ] || cargo build --release) && ./target/release/electrostatic_calc datos.txt output/calculo.json"

[tasks.plot]
description = "Genera la gráfica 2D o 3D con Python y matplotlib"
depends = ["calc"]
run = "uv run --with matplotlib --with numpy python scripts/plot_field.py output/calculo.json output/campo_electrico.png"

[tasks.report]
description = "Compila el informe paso a paso en PDF con Typst"
depends = ["plot"]
run = "typst compile informe.typ output/reporte_campo_electrico.pdf"

[tasks.all]
description = "Ejecuta el pipeline completo usando el binario existente (sin recompilar si ya está listo)"
depends = ["report"]
run = """
echo ""
echo "======================================================================"
echo "✅ PIPELINE COMPLETADO EXITOSAMENTE"
echo "📄 Reporte PDF generado: output/reporte_campo_electrico.pdf"
echo "📊 Gráfica generada:    output/campo_electrico.png"
echo "💾 Datos en formato JSON: output/calculo.json"
echo "======================================================================"
"""

[tasks.open]
description = "Abre el reporte PDF generado con el visor del sistema"
run = "xdg-open output/reporte_campo_electrico.pdf 2>/dev/null || echo 'Abre el archivo: output/reporte_campo_electrico.pdf'"

[tasks.clean]
description = "Elimina los artefactos generados (output y target)"
run = "rm -rf output target"
